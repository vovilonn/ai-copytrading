# Реверс-прокси админки copytrade-бота. Вариант «TLS терминирует Cloudflare, origin слушает :80».
# Проверен живьём на ai-copytrade.zenfi.org (nginx 1.28, Ubuntu).
#
# Куда класть:  /etc/nginx/sites-enabled/copytrade.conf (или /etc/nginx/conf.d/copytrade.conf)
# Домен:        ai-copytrade.zenfi.org — подставлен, править только его.
# Апстрим:      10.19.130.6:5173 — адрес хоста с контейнерами. Если nginx стоит НА ТОМ ЖЕ хосте,
#               меняйте на 127.0.0.1:5173; если на другом (наш случай) — на внутренний адрес того
#               хоста, а сам контейнер web надо опубликовать на этом адресе, см. docs/deploy.md §10.
#
# Схема: браузер --TLS--> Cloudflare --http--> этот nginx :80 --> <хост с docker>:5173 (контейнер
#        web) --> он же отдаёт SPA и проксирует /api и /socket.io на api:3000.
#
# ПЕРЕД ПЕРВЫМ ЗАПУСКОМ создайте три списка подсетей Cloudflare (по одной команде за раз —
# перенос строки при копипасте рвёт редирект и файл не переписывается):
#
#   { curl -s https://www.cloudflare.com/ips-v4; echo; curl -s https://www.cloudflare.com/ips-v6; } | grep -v '^$' > /tmp/cf-ips.txt
#   sed 's/^/set_real_ip_from /; s/$/;/' /tmp/cf-ips.txt > /etc/nginx/conf.d/cloudflare-real-ip.inc
#   sed 's/^/  /; s/$/ 1;/'             /tmp/cf-ips.txt > /etc/nginx/conf.d/cloudflare-geo.inc
#   nginx -t && systemctl reload nginx
#
# Три грабли, все пойманы живьём на этом сервере:
#   1) `echo` между curl обязателен: ответ ips-v4 приходит БЕЗ перевода строки в конце, и последняя
#      v4-подсеть слипается с первой v6 — nginx падает с «host not found in set_real_ip_from
#      "131.0.72.0/222400:cb00::/32"». Проверка: `wc -l` даёт 22 строки.
#   2) НЕ держите резервные копии рядом (`.inc.bak`): маска include ниже — `...*.inc`, она их не
#      подхватит, а вот `...inc*` подхватывала, и nginx падал на копии.
#   3) Доступ «только через Cloudflare» нельзя делать через allow/deny: модуль real_ip подменяет
#      $remote_addr на IP КОНЕЧНОГО клиента ещё до проверки доступа, и список CF отсекает всех.
#      Поэтому ниже geo по $realip_remote_addr — адресу самого соединения.
#
# Списки Cloudflare меняются редко; обновляйте их теми же командами раз в пару месяцев.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Ограничение частоты входа: админка = полный доступ к торговле, брутфорс по паролю недопустим.
# Работает по РЕАЛЬНОМУ адресу клиента только вместе с real_ip ниже.
# Пришёл ли запрос от Cloudflare. Сверяем $realip_remote_addr — АДРЕС СОЕДИНЕНИЯ ДО подмены
# модулем real_ip: сам $remote_addr к моменту проверки доступа уже равен IP конечного клиента,
# и список подсетей CF на нём отсекал бы ровно всех (живьём: 403 на любой запрос через CF).
geo $realip_remote_addr $copytrade_from_cf {
    default 0;
    include /etc/nginx/conf.d/cloudflare-geo.inc;
}

limit_req_zone $binary_remote_addr zone=copytrade_login:10m rate=5r/m;

server {
    listen      80;
    listen      [::]:80;
    server_name ai-copytrade.zenfi.org;

    # ── Настоящий IP клиента из-за Cloudflare ───────────────────────────────────────────────
    # Без этого $remote_addr — адрес края Cloudflare: лимит на логин станет общим на всех, а в
    # логах вместо клиентов будут адреса CDN. Файл генерируется командой из шапки; шаблон с
    # маской не ломает конфиг, если файла ещё нет.
    include /etc/nginx/conf.d/cloudflare-real-ip*.inc;
    real_ip_header CF-Connecting-IP;

    # ── Пускать только через Cloudflare ─────────────────────────────────────────────────────
    # Иначе тот, кто узнал IP сервера, откроет админку напрямую, минуя и TLS, и правила CF.
    # Тем более что между CF и origin трафик идёт открытым текстом (режим Flexible).
    # Если решите ходить напрямую (например, отключили прокси CF) — закомментируйте обе строки.
    if ($copytrade_from_cf = 0) {
        return 403;
    }

    add_header X-Frame-Options        "DENY"        always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header Referrer-Policy        "no-referrer" always;

    access_log /var/log/nginx/copytrade.access.log;
    error_log  /var/log/nginx/copytrade.error.log warn;

    # Загрузок в приложении нет — большой лимит только увеличивал бы поверхность атаки.
    client_max_body_size 2m;

    # ── Вход: тот же прокси, но с лимитом частоты ───────────────────────────────────────────
    location = /api/auth/login {
        limit_req        zone=copytrade_login burst=5 nodelay;
        limit_req_status 429;

        proxy_pass       http://10.19.130.6:5173;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Схему берём ту, что видел браузер (CF присылает https), а не свою — у нас всегда http.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # ── Realtime (socket.io): апгрейд соединения и длинные таймауты ─────────────────────────
    location /socket.io/ {
        proxy_pass         http://10.19.130.6:5173;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;

        # ⚠️ ВРЕМЕННЫЙ ОБХОД, пока в коде не вынесен разрешённый Origin (docs/deploy.md §10):
        # apps/api/src/realtime/realtime.gateway.ts жёстко разрешает http://localhost:5173, и
        # хендшейк с реального домена был бы отклонён — таблицы перестали бы обновляться сами
        # (REST при этом работает, поэтому дефект выглядит как «данные только по F5»).
        # Подменяем Origin здесь. Безопасность от этого не страдает: кука сессии SameSite=lax
        # с чужого сайта к вебсокету всё равно не приложится, а значит и авторизация не пройдёт.
        # Как только в gateway появится WEB_ORIGIN — эту строку удалите.
        proxy_set_header   Origin            http://localhost:5173;

        # Соединение живёт долго и молчит между событиями — дефолтные 60с рвали бы его.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # ── SPA + REST ──────────────────────────────────────────────────────────────────────────
    location / {
        proxy_pass       http://10.19.130.6:5173;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}
