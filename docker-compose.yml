services:
  ai-proxy:
    build:
      context: ./ai-proxy
      dockerfile: Dockerfile
    image: bybit-copytrade-ai-proxy:local
    container_name: bybit-copytrade-ai-proxy
    environment:
      # Включает callback-forwarder на 0.0.0.0 вместо 127.0.0.1 внутри контейнера.
      DEPLOY: docker
      TZ: ${TZ:-Etc/UTC}
      MANAGEMENT_PASSWORD: ${AI_PROXY_MANAGEMENT_KEY:?not set — скопируйте .env.example в .env}
    ports:
      # 8317 менять нельзя: OAuth-редирект жёстко ведёт на 127.0.0.1:<port из конфига>.
      - "127.0.0.1:8317:8317"
      # Callback Claude OAuth (redirect_uri=http://localhost:54545/callback).
      - "127.0.0.1:54545:54545"
    volumes:
      - ./ai-proxy.config.yaml:/CLIProxyAPI/config.yaml
      - ./.ai-proxy/auths:/root/.cli-proxy-api
      - ./.ai-proxy/logs:/CLIProxyAPI/logs
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8317"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: bybit-copytrade-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-copytrade}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?not set — скопируйте .env.example в .env}
      POSTGRES_DB: ${POSTGRES_DB:-copytrade}
      TZ: ${TZ:-Etc/UTC}
    ports:
      # Порт вынесен в переменную: 5432 на хосте часто занят postgres другого проекта.
      - "127.0.0.1:${POSTGRES_PORT:-5442}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-copytrade} -d ${POSTGRES_DB:-copytrade}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: bybit-copytrade-api:local
    container_name: bybit-copytrade-api
    env_file:
      - .env
    environment:
      # Внутри сети compose postgres слушает свой контейнерный порт (5432), а не опубликованный
      # на хосте POSTGRES_PORT (5442 по умолчанию) — .env не трогаем, переопределяем только
      # здесь (см. бриф задачи 13). env_file подставляет .env первым, эта секция — поверх него.
      DATABASE_URL: postgresql://${POSTGRES_USER:-copytrade}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-copytrade}
      PORT: 3000
      # ВАЖНО: не production. sessionCookieOptions() (apps/api/src/auth/cookie.ts) ставит
      # Secure только когда NODE_ENV=production — а весь стек здесь работает по обычному http
      # (127.0.0.1:5173, без TLS). Secure-кука над http браузер тихо не сохранит, и вход
      # сломается без единой видимой ошибки.
      NODE_ENV: development
      # Корень медиа-хранилища. В prod-образе код лежит в /app/src (pnpm deploy --prod сплющивает
      # apps/<name>/src → src), поэтому вычислять корень «на N уровней вверх от import.meta.url»
      # нельзя — глубина вложенности разная в dev и в образе. Задаём явным путём (тот же том, что
      # у tg-ingest/engine); в dev, где переменной нет, config.schema.ts ищет корень воркспейса.
      MEDIA_ROOT: /app/var/media
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Раздача медиа: GET /api/media/:id (apps/api/src/channels/media.controller.ts) читает
      # var/media/<key>/... относительно MEDIA_ROOT — тот же том, что пишет tg-ingest.
      - ./var:/app/var
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  tg-ingest:
    build:
      context: .
      dockerfile: apps/tg-ingest/Dockerfile
    image: bybit-copytrade-tg-ingest:local
    container_name: bybit-copytrade-tg-ingest
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-copytrade}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-copytrade}
      # См. комментарий у api: в prod-образе глубина вложенности кода другая, поэтому корень медиа
      # задаётся явно, а не считается от import.meta.url.
      MEDIA_ROOT: /app/var/media
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    volumes:
      # Медиа (фото/превью видео) пишется сюда воркером — apps/tg-ingest/src/ingest.service.ts:
      # файл кладётся в MEDIA_ROOT/<key>/..., а в БД (message_media.storage_path) остаётся
      # относительный путь 'var/media/<key>/...' — его же читают api и engine.
      - ./var:/app/var
    deploy:
      # Ровно одна реплика: воркер MTProto держит единственную сессию Telegram (TG_SESSION) —
      # вторая реплика вызвала бы конфликт сессии/дублирующийся консюмер обновлений.
      replicas: 1
    restart: unless-stopped

  engine:
    build:
      context: .
      dockerfile: apps/engine/Dockerfile
    image: bybit-copytrade-engine:local
    container_name: bybit-copytrade-engine
    env_file:
      - .env
    environment:
      # Та же переопределённая переменная, что у api/tg-ingest (задача 13): внутри сети compose
      # postgres слушает свой контейнерный порт 5432, а не опубликованный на хосте POSTGRES_PORT.
      DATABASE_URL: postgresql://${POSTGRES_USER:-copytrade}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-copytrade}
      # Ф3 задача 6 (task-6-brief.md): `.env` НЕ трогаем (EXECUTION_MODE=dry_run в нём остаётся
      # дефолтом навсегда) — для приёмки live-режима запуск переопределяет переменную ОКРУЖЕНИЯ
      # шелла перед `docker compose up`, напр. `EXECUTION_MODE=live docker compose up -d engine`.
      # Docker Compose сначала подставляет её из переменных окружения самого шелла, и только если
      # там её нет — берёт из служебного .env рядом с этим файлом (тот же .env, что и env_file
      # выше) — поэтому `${EXECUTION_MODE:-dry_run}` безопасен и НЕ меняет поведение по умолчанию.
      EXECUTION_MODE: ${EXECUTION_MODE:-dry_run}
      # Внутри контейнера 127.0.0.1 (значение из .env) — это САМ engine, а не прокси: все AI-вызовы
      # падали с ECONNREFUSED (ai_calls.http_status=0), и сообщения ch2 уходили в
      # needs_review/ai_unavailable вместо исполнения. В сети compose прокси доступен по имени
      # сервиса. Тот же приём, что и с DATABASE_URL выше: .env не трогаем, переопределяем здесь.
      AI_PROXY_URL: http://ai-proxy:8317
      # engine читает картинки сообщения и кладёт их в AI-промпт (apps/engine/src/ai/context.ts) —
      # тот же корень и тот же том, что у tg-ingest (который их пишет).
      MEDIA_ROOT: /app/var/media
    depends_on:
      postgres:
        condition: service_healthy
      ai-proxy:
        condition: service_healthy
    volumes:
      # Картинки для AI-промпта (ai/context.ts:204 читает файл по message_media.storage_path).
      # Без этого тома engine физически не видел медиа и разбирал сигналы ch2 «вслепую», без графиков.
      - ./var:/app/var
    deploy:
      # Ровно одна реплика: engine — единственный писатель в trades/orders/positions
      # (ExecutionPort, design spec §14) — вторая реплика продублировала бы обработку сообщений
      # (advisory-lock в main.ts защищает от гонки внутри процесса, но не отменяет решение
      # держать ровно одну реплику по умолчанию).
      replicas: 1
    # Ничего не слушает по сети (кроме исходящих подключений к Postgres/Bybit) — портов не публикует.
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: bybit-copytrade-web:local
    container_name: bybit-copytrade-web
    depends_on:
      api:
        condition: service_healthy
    ports:
      # Порт зафиксирован на 5173 не только по брифу, но и по факту: RealtimeGateway
      # (apps/api/src/realtime/realtime.gateway.ts, DEV_ORIGIN) жёстко проверяет Origin
      # 'http://localhost:5173' на WS-хендшейке — другой порт хоста сломает CORS сокета.
      - "127.0.0.1:5173:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data:
