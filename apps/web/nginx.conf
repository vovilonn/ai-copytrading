# Реверс-прокси для контейнера web (см. apps/web/Dockerfile). Зеркалит поведение dev-прокси
# Vite (apps/web/vite.config.ts): /api и /socket.io уходят на api:3000 БЕЗ переписывания пути
# (proxy_pass без хвостового URI после host:port сохраняет исходный $request_uri целиком —
# как и Vite, который тоже не делает rewrite), всё остальное — SPA с фолбэком на index.html.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Healthcheck контейнера (docker-compose.yml) — быстрый ответ без похода в SPA-роутинг.
    location = /healthz {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: любой прочий путь (в т.ч. /channels/:id при жёсткой перезагрузке) отдаёт index.html —
    # react-router сам разберёт маршрут на клиенте.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
